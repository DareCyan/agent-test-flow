# ============================================================================
#  智能体配置文件 · 模板
#  用途：r1「智能体配置文件」槽位直接上传本文件；后端会真读文本并解析，
#        用其中的 api / key / model 做一次「模型联通性识别」实测。
#
#  格式：扁平 "key: value" 键值（.yaml / .yml / .json 均可）
#        · "#" 之后是注释；字符串可加可不加引号
#        · [a, b, c] 形式会被解析成数组
#        · 不支持嵌套层级（不要写 agent: { api: ... } 这种结构）
# ============================================================================

# ---------------------------- 必填三项 ----------------------------
# 智能体自己的模型服务地址。也接受 base_url / api_url / endpoint 等同义键。
# 末尾缺 /v1 会自动补；联通性探测先试 GET {api}/models，
# 若该端点没有此方法，再退化为一次 max_tokens=1 的最小对话请求。
api: https://api.openai.com/v1

# 智能体自己的 API Key。日志与接口响应里只出现脱敏掩码（如 sk-x****cdef），
# 完整 key 不会回显到页面、日志或接口返回中。
key: sk-REPLACE-WITH-YOUR-KEY

# 模型名。也接受 model_name / model_id。
model: gpt-4o-mini


# ---------------------------- 可选字段 ----------------------------
# 智能体名称（缺省时取二进制 .zip 的文件名）
name: shopping-agent-v2

# 模型协议；会显示在「模型协议识别」一步的结果里
protocol: openai-compatible

# 支持的调用方式
call_modes: [单轮对话, 多轮对话]

# 若模型地址与 api 不同，可单独声明（一般用不到）
# endpoint: https://your-gateway.example.com/v1


# ---------------------- 可选：评测能力声明 ----------------------
# 不写任何能力声明时，默认视为「支持全部 29 个 L2 能力」，仅把「图像识别」标记为不支持
# （对应 r4 能力矩阵里整列不点亮的那一列）。
#
# 方式一：按 index 的 13 个能力列名声明不支持的能力
# missing_capabilities: [图像识别]
#
# 方式二：按 L2 编号声明不支持的能力（编号见 GET /api/scene-matrix 的 l2_info）
# missing_l2: [1.4]
#
# 方式三：正向声明支持哪些 L2
# l2_capabilities: [1.1, 1.2, 1.3, 2.1, 2.2, 2.3, 3.1, 3.5, 4.1, 4.2, 6.1, 6.2, 6.7]
